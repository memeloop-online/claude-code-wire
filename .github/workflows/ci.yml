name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Native unit tests
        run: cargo test --locked
      - name: Build WASM component
        run: ./build.sh
      - name: Prepare installable artifact
        run: sha256sum plugin.wasm plugin.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: claude-request-privacy-${{ github.sha }}
          path: |
            plugin.wasm
            plugin.json
            SHA256SUMS
            README.md
            README.zh-CN.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claude-request-privacy-${{ github.sha }}
      - name: Verify release files
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes plugin.wasm plugin.json SHA256SUMS README.md README.zh-CN.md
