name: Signed OCI package

on:
  pull_request:
  push:
    branches: [master, 'release/oci-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare checksum-pinned release bytes
        run: bash scripts/oci/prepare.sh
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: oci-package-${{ github.sha }}
          path: ${{ runner.temp }}/plugin-package
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name != 'pull_request' && github.repository == 'memeloop-online/claude-code-wire' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/oci-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-oci.yml@${{ github.ref }}
      SIGNING_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: oci-package-${{ github.sha }}
          path: ${{ runner.temp }}/plugin-package
      - uses: oras-project/setup-oras@ccb71166b124a8452d1b72c4476398a909ed4d63
        with:
          version: 1.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish, sign and exercise the real MTC installer
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/oci/publish.sh
      - name: Preserve digest, signature and installation evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: oci-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/plugin-evidence
          if-no-files-found: error
          retention-days: 90
